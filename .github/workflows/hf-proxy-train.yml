name: Hugging Face Proxy Training Test

on:
  workflow_dispatch:
  push:
    paths:
      - "security_tests/hf_proxy_train.py"
      - "requirements.txt"
      - ".github/workflows/hf-proxy-train.yml"

jobs:
  hf-proxy-train:
    runs-on: ubuntu-latest

    env:
      HF_ENDPOINT: ${{ secrets.NOMA_HF_ENDPOINT }}
      HF_HUB_ETAG_TIMEOUT: "3600"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HF_HUB_DISABLE_XET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Hugging Face proxy setting
        run: |
          if [ -z "$HF_ENDPOINT" ]; then
            echo "HF_ENDPOINT is not set."
            exit 1
          fi
          echo "HF_ENDPOINT is configured."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hugging Face proxy training test
        run: |
          python security_tests/hf_proxy_train.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: trained_model/
